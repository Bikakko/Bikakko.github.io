<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar · 太阳系</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; cursor: grab;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  html.dragging, html.dragging body { cursor: grabbing; }

  #c {
    display: block; position: fixed; inset: 0;
    /* 手机必须设 none，否则浏览器把手势吃掉，拖动完全无反应 */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 50%,
      transparent 30%, rgba(0, 0, 0, 0.35) 72%, rgba(0, 0, 0, 0.82) 100%);
  }

  .hud {
    position: fixed; left: 22px; top: 20px; z-index: 3;
    color: #dce6f5; font-size: 12px; line-height: 1.8;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
    opacity: 0; transition: opacity 1.4s ease 0.5s;
    pointer-events: none;
  }
  .hud.on { opacity: 1; }
  .hud .brand {
    font-size: 17px; letter-spacing: 0.3em; font-weight: 600;
    color: #fff; margin-bottom: 1px;
  }
  .hud .brand span { color: #ffd27f; }
  .hud .sub { color: #6b7899; font-size: 11px; margin-bottom: 13px; letter-spacing: 0.14em; }
  .hud .row { color: #8794b5; }
  .hud .val { color: #ffd9a0; }

  .tip {
    position: fixed; right: 22px; bottom: 20px; z-index: 3;
    color: #5c6889; font-size: 11px; line-height: 1.95;
    text-align: right; letter-spacing: 0.05em; pointer-events: none;
    opacity: 0; transition: opacity 1.4s ease 1.1s;
  }
  .tip.on { opacity: 1; }
  .tip b { color: #93a2c8; font-weight: 500; }

  /* 天体信息卡 */
  .info {
    position: fixed; right: 22px; top: 20px; z-index: 4;
    min-width: 178px; padding: 12px 15px;
    border: 1px solid rgba(120, 150, 200, 0.22);
    border-radius: 9px;
    background: rgba(8, 12, 22, 0.72);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    color: #c9d6ec; font-size: 11px; line-height: 1.85;
    opacity: 0; transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .info.on { opacity: 1; }
  .info h3 {
    font-size: 14px; font-weight: 600; color: #fff;
    letter-spacing: 0.1em; margin-bottom: 6px;
  }
  .info .k { color: #6d7c9e; display: inline-block; width: 52px; }
  .info .v { color: #ffd9a0; }

  /* 调速按钮 */
  .ctrl {
    display: flex; gap: 4px; margin-top: 11px;
    pointer-events: auto;
  }
  .ctrl button {
    font: inherit; font-size: 10px; letter-spacing: 0.03em;
    min-width: 30px; padding: 3px 6px;
    color: #8e9cbe; background: rgba(10, 16, 28, 0.72);
    border: 1px solid rgba(110, 140, 195, 0.24);
    border-radius: 5px; cursor: pointer;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl button:hover {
    color: #dce6f5; border-color: rgba(150, 180, 235, 0.5);
    background: rgba(22, 32, 52, 0.86);
  }
  .ctrl button.on {
    color: #ffd9a0; border-color: rgba(255, 200, 120, 0.62);
    background: rgba(48, 36, 18, 0.8);
  }
  @media (max-width: 560px) {
    .ctrl { flex-wrap: wrap; gap: 5px; max-width: 168px; }
    .ctrl button { min-width: 34px; padding: 6px 7px; font-size: 10px; }
  }

  /* 行星名称标签：跟着球心投影到屏幕 */
  .labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .lbl {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, 0);
    font-size: 11px; letter-spacing: 0.12em; white-space: nowrap;
    color: #dae5f8; text-shadow: 0 0 6px #000;
    padding: 2px 7px; margin-top: 5px;
    border-radius: 4px;
    background: rgba(6, 10, 20, 0.72);
    border: 1px solid rgba(110, 140, 195, 0.20);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .lbl.on { opacity: 0.92; pointer-events: auto; cursor: pointer; }
  .lbl.on:hover {
    color: #fff; border-color: rgba(255, 210, 140, 0.55);
    background: rgba(30, 24, 14, 0.88);
  }
  .lbl:focus-visible {
    outline: 1px solid rgba(255, 210, 140, 0.8);
    outline-offset: 2px;
  }
  .lbl em {
    font-style: normal; color: #7d8cad;
    font-size: 9px; margin-left: 5px; letter-spacing: 0.05em;
  }
  @media (max-width: 560px) {
    .lbl { font-size: 9px; letter-spacing: 0.04em; }
    .lbl em { display: none; }
  }

  .loader {
    position: fixed; inset: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #45506e;
    font-size: 12px; letter-spacing: 0.45em;
    transition: opacity 1s ease;
  }
  .loader.done { opacity: 0; pointer-events: none; }

  /* 小屏收一收字号，避免挡住行星 */
  @media (max-width: 560px) {
    .hud { left: 14px; top: 12px; font-size: 11px; }
    .hud .brand { font-size: 14px; }
    .tip { right: 12px; bottom: 12px; font-size: 10px; }
    .info { right: 12px; top: 12px; min-width: 150px; font-size: 10px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="hud" id="hud">
  <div class="brand">SO<span>LAR</span></div>
  <div class="sub">程序生成太阳系 · 尺寸与轨道等比例 · J2000 轨道要素</div>
  <div class="row">时间 <span class="val" id="simtime">—</span></div>
  <div class="row">速度 <span class="val" id="speed">1×</span></div>
  <div class="row">帧率 <span class="val" id="fps">—</span></div>
  <div class="ctrl">
    <button data-sp="0" title="暂停">❚❚</button>
    <button data-sp="0.25">¼×</button>
    <button data-sp="0.5">½×</button>
    <button data-sp="1">1×</button>
    <button data-sp="2">2×</button>
    <button data-sp="4">4×</button>
    <button data-sp="8">8×</button>
    <button data-home title="回到远景全景">全景</button>
  </div>
</div>

<div class="info" id="info">
  <h3 id="infoName">—</h3>
  <div><span class="k">类型</span><span class="v" id="infoType">—</span></div>
  <div><span class="k">半长轴</span><span class="v" id="infoDist">—</span></div>
  <div><span class="k">偏心率</span><span class="v" id="infoEcc">—</span></div>
  <div><span class="k">周期</span><span class="v" id="infoPeriod">—</span></div>
  <div><span class="k">卫星</span><span class="v" id="infoMoons">—</span></div>
  <div><span class="k">轨道倾角</span><span class="v" id="infoInc">—</span></div>
</div>

<div class="tip" id="tip">
  <div><b>左键拖动</b> 环绕观察</div>
  <div><b>右键拖动</b> 平移视角</div>
  <div><b>WASD</b> 移动 / 环绕视角</div>
  <div><b>空格</b> 暂停 / 继续</div>
  <div><b>滚轮 / 双指</b> 推拉（自由视角对准光标，聚焦时对准天体）</div>
  <div><b>点击天体 / 标签</b> 聚焦</div>
  <div><b>Esc / 点空白 / 滚轮拉远</b> 取消聚焦</div>
  <div><b>双击空白 / 全景</b> 回到远景</div>
</div>

<div class="labels" id="labels"></div>

<div class="loader" id="loader">GENERATING</div>
<noscript><div style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;color:#8794b5;font-size:13px;letter-spacing:0.1em">需要启用 JavaScript 与 WebGL 才能查看太阳系</div></noscript>

<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.min.js"
  }
}
</script>

<script type="module" src="./assets/solar/main.js"></script>
</body>
</html>
