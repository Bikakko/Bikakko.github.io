<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solar · 太阳系</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; cursor: grab;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  html.dragging, html.dragging body { cursor: grabbing; }
  html.dragging canvas { cursor: grabbing; }

  #c {
    display: block; position: fixed; inset: 0;
    /* 手机必须设 none，否则浏览器把手势吃掉，拖动完全无反应 */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 50%,
      transparent 30%, rgba(0, 0, 0, 0.35) 72%, rgba(0, 0, 0, 0.82) 100%);
  }

  .hud {
    position: fixed; left: 22px; top: 20px; z-index: 3;
    color: #dce6f5; font-size: 12px; line-height: 1.8;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
    opacity: 0; transition: opacity 1.4s ease 0.5s;
    pointer-events: none;
  }
  .hud.on { opacity: 1; }
  .hud .brand {
    font-size: 17px; letter-spacing: 0.3em; font-weight: 600;
    color: #fff; margin-bottom: 1px;
  }
  .hud .brand span { color: #ffd27f; }
  .hud .sub { color: #6b7899; font-size: 11px; margin-bottom: 13px; letter-spacing: 0.14em; }
  .hud .row { color: #8794b5; }
  .hud .val { color: #ffd9a0; }

  .tip {
    position: fixed; right: 22px; bottom: 20px; z-index: 3;
    color: #5c6889; font-size: 11px; line-height: 1.95;
    text-align: right; letter-spacing: 0.05em; pointer-events: none;
    opacity: 0; transition: opacity 1.4s ease 1.1s;
  }
  .tip.on { opacity: 1; }
  .tip b { color: #93a2c8; font-weight: 500; }

  /* 天体信息卡 */
  .info {
    position: fixed; right: 22px; top: 20px; z-index: 4;
    min-width: 178px; padding: 12px 15px;
    border: 1px solid rgba(120, 150, 200, 0.22);
    border-radius: 9px;
    background: rgba(8, 12, 22, 0.72);
    backdrop-filter: blur(9px);
    color: #c9d6ec; font-size: 11px; line-height: 1.85;
    opacity: 0; transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .info.on { opacity: 1; }
  .info h3 {
    font-size: 14px; font-weight: 600; color: #fff;
    letter-spacing: 0.1em; margin-bottom: 6px;
  }
  .info .k { color: #6d7c9e; display: inline-block; width: 52px; }
  .info .v { color: #ffd9a0; }

  /* 调速按钮 */
  .ctrl {
    display: flex; gap: 4px; margin-top: 11px;
    pointer-events: auto;
  }
  .ctrl button {
    font: inherit; font-size: 10px; letter-spacing: 0.03em;
    min-width: 30px; padding: 3px 6px;
    color: #8e9cbe; background: rgba(10, 16, 28, 0.72);
    border: 1px solid rgba(110, 140, 195, 0.24);
    border-radius: 5px; cursor: pointer;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl button:hover {
    color: #dce6f5; border-color: rgba(150, 180, 235, 0.5);
    background: rgba(22, 32, 52, 0.86);
  }
  .ctrl button.on {
    color: #ffd9a0; border-color: rgba(255, 200, 120, 0.62);
    background: rgba(48, 36, 18, 0.8);
  }
  @media (max-width: 560px) {
    .ctrl { flex-wrap: wrap; gap: 5px; max-width: 168px; }
    .ctrl button { min-width: 34px; padding: 6px 7px; font-size: 10px; }
  }

  /* 行星名称标签：跟着球心投影到屏幕 */
  .labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .lbl {
    position: absolute; transform: translate(-50%, 0);
    font-size: 11px; letter-spacing: 0.12em; white-space: nowrap;
    color: #dae5f8; text-shadow: 0 0 6px #000;
    padding: 2px 7px; margin-top: 5px;
    border-radius: 4px;
    background: rgba(6, 10, 20, 0.72);
    border: 1px solid rgba(110, 140, 195, 0.20);
    backdrop-filter: blur(3px);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .lbl.on { opacity: 0.92; pointer-events: auto; cursor: pointer; }
  .lbl.on:hover {
    color: #fff; border-color: rgba(255, 210, 140, 0.55);
    background: rgba(30, 24, 14, 0.88);
  }
  .lbl em {
    font-style: normal; color: #7d8cad;
    font-size: 9px; margin-left: 5px; letter-spacing: 0.05em;
  }
  @media (max-width: 560px) {
    .lbl { font-size: 9px; letter-spacing: 0.04em; }
    .lbl em { display: none; }
  }

  .loader {
    position: fixed; inset: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #45506e;
    font-size: 12px; letter-spacing: 0.45em;
    transition: opacity 1s ease;
  }
  .loader.done { opacity: 0; pointer-events: none; }

  /* 小屏收一收字号，避免挡住行星 */
  @media (max-width: 560px) {
    .hud { left: 14px; top: 12px; font-size: 11px; }
    .hud .brand { font-size: 14px; }
    .tip { right: 12px; bottom: 12px; font-size: 10px; }
    .info { right: 12px; top: 12px; min-width: 150px; font-size: 10px; }
  }

<script type="module">
import * as THREE from "three";

/* ============================================================
   太阳系 · Solar
   - 行星表面：着色器程序化噪声，不加载任何贴图
   - 轨道相机：自实现，限制在水平面以上
   - 触屏：touch-action + 手写 touch 事件
   ============================================================ */

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: "high-performance",
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;

const scene = new THREE.Scene();
// 场景跨度到 ~303 单位（海王星轨道），远平面放到 6000。
// 近平面每帧随相机距离动态计算（见 updateCamera）：真实比例下地球半径
// 只有 0.0004 单位，固定 0.5 的近平面会把聚焦后的行星整颗裁掉。
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 6000);

/* ---------- 查询参数：让每个状态可截图 ---------- */
const Q = new URLSearchParams(location.search);
const qT    = Q.has("t")    ? parseFloat(Q.get("t"))    : 0;
const qAz   = Q.has("az")   ? parseFloat(Q.get("az"))   : null;
const qEl   = Q.has("el")   ? parseFloat(Q.get("el"))   : null;
const qDist = Q.has("dist") ? parseFloat(Q.get("dist")) : null;
const qFocus = Q.get("focus");
const qStatic = Q.get("static") === "1";

// ============================================================
//  比例基准（严格等比例）
//  AU_UNIT: 1 AU = 10.06 世界单位，轨道距离按真实 AU 线性换算。
//  天体半径与轨道距离共用 KM_PER_UNIT，默认不做任何尺寸放大。
//  ?size=25 可临时放大天体半径（轨道不变），仅用于对比观察。
// ============================================================
const AU_UNIT      = 10.06;
const KM_PER_AU    = 149597870.7;
const KM_PER_UNIT  = KM_PER_AU / AU_UNIT;
const SIZE_PARAM   = parseFloat(Q.get("size"));
const RADIUS_SCALE = Number.isFinite(SIZE_PARAM) && SIZE_PARAM > 0 ? SIZE_PARAM : 1.0;
const kmToUnit     = (km) => (km / KM_PER_UNIT) * RADIUS_SCALE;
const AU_TO_UNIT   = (au) => au * AU_UNIT;
const SUN_RADIUS   = kmToUnit(696340);
const TAU          = Math.PI * 2;
const DEG          = Math.PI / 180;

/* ============================================================
   1. 星空背景
   ============================================================ */
function buildStars() {
  const N = 4200;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const size = new Float32Array(N);
  const seed = new Float32Array(N);

  let s = 90210;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };

  const c1 = new THREE.Color(0xffffff);
  const c2 = new THREE.Color(0xa8c4ff);
  const c3 = new THREE.Color(0xffd9b0);

  for (let i = 0; i < N; i++) {
    const r = 900 + rnd() * 900;
    const th = rnd() * Math.PI * 2;
    const ph = Math.acos(2 * rnd() - 1);
    pos[i*3]   = Math.sin(ph) * Math.cos(th) * r;
    pos[i*3+1] = Math.cos(ph) * r;
    pos[i*3+2] = Math.sin(ph) * Math.sin(th) * r;

    const pick = rnd();
    const c = pick < 0.7 ? c1 : (pick < 0.9 ? c2 : c3);
    const b = 0.45 + rnd() * 0.55;
    col[i*3] = c.r * b; col[i*3+1] = c.g * b; col[i*3+2] = c.b * b;

    size[i] = 0.7 + Math.pow(rnd(), 3) * 3.2;
    seed[i] = rnd();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
  geo.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */ `
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aSeed;
      uniform float uTime;
      uniform float uPixel;
      varying vec3 vCol;
      varying float vA;
      void main() {
        vCol = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        // 轻微闪烁
        vA = 0.55 + 0.45 * sin(uTime * 1.4 + aSeed * 62.0);
        gl_PointSize = aSize * uPixel;
      }
    `,
    fragmentShader: /* glsl */ `
      varying vec3 vCol;
      varying float vA;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float a = pow(smoothstep(0.5, 0.0, d), 1.6);
        gl_FragColor = vec4(vCol, a * vA);
      }
    `,
  });

  const p = new THREE.Points(geo, mat);
  p.frustumCulled = false;
  return { points: p, uniforms: mat.uniforms };
}
const stars = buildStars();
scene.add(stars.points);

/* ============================================================
   2. 通用噪声（给行星表面用，GLSL 里实现）
   ============================================================ */
const NOISE_GLSL = /* glsl */ `
  // 3D 值噪声
  float hash31(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float noise3(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash31(i + vec3(0,0,0)), hash31(i + vec3(1,0,0)), f.x),
          mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
      mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
          mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y),
      f.z);
  }
  float fbm3(vec3 p, int oct) {
    float s = 0.0, a = 0.5, n = 0.0;
    for (int i = 0; i < 6; i++) {
      if (i >= oct) break;
      s += noise3(p) * a;
      n += a;
      p *= 2.03;
      a *= 0.5;
    }
    return s / n;
  }
  // 用于行星的带状扰动
  float bandNoise(vec3 p, float freq) {
    return fbm3(vec3(p.x * freq, p.y * freq * 2.4, p.z * freq), 5);
  }
`;

/* ============================================================
   3. 太阳
   ============================================================ */
const sunUniforms = { uTime: { value: 0 } };
const sunGroup = new THREE.Group();

function buildSun() {
  const geo = new THREE.SphereGeometry(SUN_RADIUS, 96, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: /* glsl */ `
      varying vec3 vN;
      varying vec3 vPos;
      void main() {
        vN = normalize(normalMatrix * normal);
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      varying vec3 vN;
      varying vec3 vPos;
      ${NOISE_GLSL}
      void main() {
        // 表面颗粒 + 缓慢流动
        float n = fbm3(vPos * 2.6 + vec3(0.0, uTime * 0.12, 0.0), 5);
        float n2 = fbm3(vPos * 6.5 - vec3(uTime * 0.2, 0.0, 0.0), 4);

        float heat = n * 0.62 + n2 * 0.38;

        vec3 cool = vec3(1.0, 0.38, 0.06);
        vec3 warm = vec3(1.0, 0.72, 0.28);
        vec3 hot  = vec3(1.0, 0.97, 0.86);

        vec3 col = mix(cool, warm, smoothstep(0.25, 0.62, heat));
        col = mix(col, hot, smoothstep(0.62, 0.92, heat));

        // 边缘略暗，做出球体感
        float rim = pow(1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0))), 2.0);
        col *= 1.0 - rim * 0.35;

        gl_FragColor = vec4(col * 1.55, 1.0);
      }
    `,
  });
  const m = new THREE.Mesh(geo, mat);
  sunGroup.add(m);
  return m;
}
const sunMesh = buildSun();

// 光晕：两层面向相机的面片，加性混合
function buildCorona(radius, opacity, color) {
  const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uOpacity: { value: opacity },
      uTime: sunUniforms.uTime,
    },
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        float d = length(vUv - 0.5) * 2.0;
        // 内实外虚
        float a = pow(max(0.0, 1.0 - d), 2.6);
        a *= 0.82 + 0.18 * sin(uTime * 0.7);
        gl_FragColor = vec4(uColor, a * uOpacity);
      }
    `,
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = -1;
  return m;
}

// 光晕：真实日面按比例只有 5.2 单位，全景下是个点。
// 但太阳的眩光范围远大于日面本体，放大光晕不违反「天体比例真实」。
// 光晕外缘控制在 ~2.4 倍水星轨道内，否则整个内圈被光雾糊住
const corona1 = buildCorona(SUN_RADIUS * 1.75, 0.58, 0xff9a3c);
const corona2 = buildCorona(SUN_RADIUS * 2.90, 0.30, 0xffcf80);
const corona3 = buildCorona(SUN_RADIUS * 4.20, 0.14, 0xffe0a8);
sunGroup.add(corona1, corona2, corona3);
sunGroup.renderOrder = -1;
scene.add(sunGroup);

// 太阳旁边的体光源（只给标准材质的月球打光；行星使用自定义 shader）
const sunLight = new THREE.PointLight(0xfff0d0, 120, 0, 2);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// 极弱环境光，避免行星背光面全黑
scene.add(new THREE.AmbientLight(0x38456a, 1.15));

/* ============================================================
   4. 行星数据
   ============================================================ */
// 真实数据（J2000 历元）：
//   radiusKm  平均半径（km）
//   aAU       半长轴（AU）
//   e         偏心率
//   incDeg    轨道倾角（黄道面为基准）
//   nodeDeg   升交点黄经 Ω
//   varpiDeg  近日点黄经 ϖ
//   meanLonDeg 平黄经 L（J2000）
//   tiltDeg   自转轴倾角；spinHours 为恒星自转周期（负值表示逆向）
// 半径与轨道距离共用同一个 KM_PER_UNIT，不再做视觉压缩。
const PLANETS = [
  {
    name: "水星", type: "类地行星",
    radiusKm: 2439.7, aAU: 0.38709927, e: 0.20563593,
    incDeg: 7.00497902, nodeDeg: 48.33076593, varpiDeg: 77.45779628, meanLonDeg: 252.25032350,
    tiltDeg: 0.034, moons: 0, spinHours: 1407.6, orbitDays: 87.969,
    colorA: 0x9a8f85, colorB: 0x5c524a, colorC: 0xc9bdb0,
    noiseFreq: 9.0, bandAmp: 0.0, roughness: 1.0,
  },
  {
    name: "金星", type: "类地行星",
    radiusKm: 6051.8, aAU: 0.72333566, e: 0.00677672,
    incDeg: 3.39467605, nodeDeg: 76.67984255, varpiDeg: 131.60246718, meanLonDeg: 181.97909950,
    tiltDeg: 177.36, moons: 0, spinHours: -5832.5, orbitDays: 224.701,
    colorA: 0xe8c98a, colorB: 0xb08a4c, colorC: 0xfff0c4,
    noiseFreq: 4.4, bandAmp: 0.55, roughness: 0.9,
  },
  {
    name: "地球", type: "类地行星",
    radiusKm: 6371.0, aAU: 1.00000261, e: 0.01671123,
    incDeg: 0.0, nodeDeg: 0.0, varpiDeg: 102.93768193, meanLonDeg: 100.46457166,
    tiltDeg: 23.44, moons: 1, spinHours: 23.934, orbitDays: 365.256,
    colorA: 0x2f6fa8, colorB: 0x2e7a3e, colorC: 0xf2f6ff,
    noiseFreq: 3.6, bandAmp: 0.0, roughness: 0.85,
    earthLike: true,
  },
  {
    name: "火星", type: "类地行星",
    radiusKm: 3389.5, aAU: 1.52371034, e: 0.09339410,
    incDeg: 1.84969142, nodeDeg: 49.55953891, varpiDeg: 336.05637041, meanLonDeg: 355.44656795,
    tiltDeg: 25.19, moons: 2, spinHours: 24.623, orbitDays: 686.98,
    colorA: 0xb5573a, colorB: 0x7d3a26, colorC: 0xe8b08c,
    noiseFreq: 6.0, bandAmp: 0.0, roughness: 0.95,

/* ============================================================
   5. 行星材质：程序化表面
   ============================================================ */
function makePlanetMaterial(cfg) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime:      { value: 0 },
      uColorA:    { value: new THREE.Color(cfg.colorA) },
      uColorB:    { value: new THREE.Color(cfg.colorB) },
      uColorC:    { value: new THREE.Color(cfg.colorC) },
      uFreq:      { value: cfg.noiseFreq },
      uBandAmp:   { value: cfg.bandAmp },
      uEarth:     { value: cfg.earthLike ? 1 : 0 },
      uSunDir:    { value: new THREE.Vector3(1, 0, 0) },
      uSunDist:   { value: 8.0 },
    },
    vertexShader: /* glsl */ `
      varying vec3 vPos;
      varying vec3 vNormalW;
      varying vec3 vWorldPos;
      void main() {
        vPos = position;
        vNormalW = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      uniform float uFreq;
      uniform float uBandAmp;
      uniform float uEarth;
      uniform vec3 uSunDir;
      uniform float uSunDist;

      varying vec3 vPos;
      varying vec3 vNormalW;
      varying vec3 vWorldPos;

      ${NOISE_GLSL}

      void main() {
        vec3 p = normalize(vPos);

        // 基础噪声
        float n = fbm3(p * uFreq + 13.0, 5);

        // 条带（气态行星用）：沿 y 轴切水平带
        float lat = p.y;
        float bandN = fbm3(vec3(p.x * uFreq * 0.7, lat * uFreq * 2.6, p.z * uFreq * 0.7) + 3.0, 5);
        float bands = sin(lat * 22.0 + bandN * 5.5) * 0.5 + 0.5;
        bands = mix(n, bands, uBandAmp * 0.75);

        vec3 col = mix(uColorB, uColorA, smoothstep(0.32, 0.68, bands));
        col = mix(col, uColorC, smoothstep(0.70, 0.92, bands) * 0.65);

        // 地球：把噪声当海陆，加极冠
        if (uEarth > 0.5) {
          float land = smoothstep(0.52, 0.56, n);
          vec3 ocean = mix(vec3(0.06, 0.22, 0.42), vec3(0.12, 0.36, 0.60), smoothstep(0.3, 0.55, n));
          vec3 ground = mix(vec3(0.24, 0.42, 0.20), vec3(0.52, 0.46, 0.28), smoothstep(0.55, 0.75, n));
          col = mix(ocean, ground, land);

          // 极地冰盖
          float ice = smoothstep(0.80, 0.94, abs(p.y));
          col = mix(col, vec3(0.94, 0.97, 1.0), ice);

          // 云层
          float cloud = fbm3(p * 5.2 + vec3(uTime * 0.02, 0.0, 0.0), 5);
          float cmask = smoothstep(0.56, 0.72, cloud) * 0.55;
          col = mix(col, vec3(1.0), cmask);
        }

        // 光照：点光源在原点
        vec3 L = normalize(-vWorldPos);
        float ndl = max(dot(normalize(vNormalW), L), 0.0);

        // 柔化明暗交界
        float lightAmt = pow(ndl, 0.62);

        // 背光面留一点自发光，避免死黑
        vec3 ambient = col * 0.30;

        // 边缘光（大气散射感）
        vec3 V = normalize(cameraPosition - vWorldPos);
        float fres = pow(1.0 - max(dot(normalize(vNormalW), V), 0.0), 3.0);
        vec3 rim = vec3(0.45, 0.62, 1.0) * fres * 0.32 * lightAmt;

        vec3 finalCol = col * lightAmt * 1.75 + ambient + rim;

        gl_FragColor = vec4(finalCol, 1.0);
      }
    `,
  });
}

/* ============================================================
   6. 行星 + 轨道
   ============================================================ */
const planets = [];
const clickable = [];
let moonMesh = null, moonDot = null;

// 轨道平面：真实倾角，不再做视觉放大。
// 轨道要素取 J2000 历元，位置由开普勒方程解出，
// 所以轨道是椭圆、公转速度随日心距变化，和真实太阳系一致。
function orbitMatrix(incDeg, nodeDeg) {
  // 升交点坐标系：+X 指向升交点，Y 为黄道面法线（three.js 的 Y-up）。
  // three.js 的 Ry(θ) 把 (x,z) 方位角转 -θ，所以用 -Ω 让升交点落到黄经 Ω，
  // 然后绕这条升交点线倾斜真实倾角 i。
  const m = new THREE.Matrix4().makeRotationY(-nodeDeg * DEG);
  m.multiply(new THREE.Matrix4().makeRotationX(-incDeg * DEG));
  return m;
}

function solveKepler(M, e) {
  const m = ((M % TAU) + TAU) % TAU;
  let E = m + e * Math.sin(m);
  for (let i = 0; i < 8; i++) {
    const d = (E - e * Math.sin(E) - m) / (1 - e * Math.cos(E));
    E -= d;
    if (Math.abs(d) < 1e-12) break;
  }
  return E;
}

// E 为偏近点角；输出该行星在黄道坐标系里的位置（世界单位）
function orbitalPoint(cfg, E, matrix, out) {
  const cosE = Math.cos(E), sinE = Math.sin(E);
  // 轨道平面内坐标：x 指向近日点，y 与之垂直
  const x = cfg.aAU * (cosE - cfg.e);
  const y = cfg.aAU * Math.sqrt(1 - cfg.e * cfg.e) * sinE;
  // 从升交点量起的轨道面角度 = 近日点幅角 + 真近点角
  const u = (cfg.varpiDeg - cfg.nodeDeg) * DEG + Math.atan2(y, x);
  const r = Math.hypot(x, y) * AU_UNIT;
  out.set(Math.cos(u) * r, 0, Math.sin(u) * r);
  return matrix ? out.applyMatrix4(matrix) : out;
}

function orbitalPosition(cfg, days, matrix, out) {
  // 平近点角 = J2000 平黄经差 + 平均角速度 × 距 J2000 的天数
  const M = (cfg.meanLonDeg - cfg.varpiDeg) * DEG
          + (TAU / cfg.orbitDays) * days
          + cfg.mAnomalyBias;
  return orbitalPoint(cfg, solveKepler(M, cfg.e), matrix, out);
}

function makeOrbitLine(cfg) {
  const SEG = 256;
  const pts = [];
  const v = new THREE.Vector3();
  for (let i = 0; i <= SEG; i++) {
    orbitalPoint(cfg, (i / SEG) * TAU, cfg._plane, v);
    pts.push(v.clone());
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: 0x4a5a80, transparent: true, opacity: 0.34,
    depthWrite: false,
  });
  return new THREE.Line(geo, mat);
}

// 最小可见光点：用点精灵实现，屏幕尺寸恒定（sizeAttenuation: false）
function makeMinDot(cfg) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const g = cv.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  const c = new THREE.Color(cfg.colorA);
  const rgb = `${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)}`;
  grad.addColorStop(0.00, `rgba(255,255,255,0.70)`);
  grad.addColorStop(0.28, `rgba(${rgb},0.75)`);
  grad.addColorStop(0.62, `rgba(${rgb},0.25)`);
  grad.addColorStop(1.00, `rgba(${rgb},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.PointsMaterial({
    size: 9, sizeAttenuation: false,
    map: tex, transparent: true, depthWrite: false,
    depthTest: true, blending: THREE.AdditiveBlending,
    opacity: 0.0,
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0], 3));
  const pts = new THREE.Points(geo, mat);
  pts.renderOrder = 2;
  pts.userData = cfg;
  return pts;
}

// 太阳的屏幕空间指示点：真实半径在全景下不足 0.1px，属于 UI 层，
// 与行星光点同一套逻辑，不参与比例计算。
const sunDot = makeMinDot({ colorA: 0xffd9a0 });
sunDot.material.size = 12;
sunGroup.add(sunDot);

for (const cfg of PLANETS) {
  const group = new THREE.Group();
  // 初始方位固定，保证同一 ?t 的截图完全可复现
  cfg._plane = orbitMatrix(cfg.incDeg, cfg.nodeDeg);

  const geo = new THREE.SphereGeometry(cfg.radius, 56, 40);
  const mat = makePlanetMaterial(cfg);
  const mesh = new THREE.Mesh(geo, mat);

  // 直接挂在 group 上：之前多套一层 tiltPivot，shader 里用 mat3(modelMatrix)
  // 取法线时拿到了异常的矩阵，整棵子树的 matrixWorld 全变 NaN。
  // 倾角改用 mesh 自己的旋转，只为视觉，不参与运算。
  group.add(mesh);
  mesh.rotation.z = cfg.tilt;   // 轴倾角
  mesh.userData = cfg;

  // 土星环：用 1D DataTexture 存环带剖面，材质走最普通的 MeshBasicMaterial.map
  // 这条路不依赖 shader、不依赖顶点色，是最稳的
  if (cfg.ring) {
    // 土星主环：C 环内缘 74,658 km 至 A 环外缘 136,775 km（真实值）
    const inner = kmToUnit(74658);
    const outer = kmToUnit(136775);
    const TEXW = 512;

    // 生成环带剖面：颜色 + alpha 都烘进贴图
    const data = new Uint8Array(TEXW * 4);
    for (let i = 0; i < TEXW; i++) {
      const t = i / (TEXW - 1);

      let bands = (Math.sin(t * 46.0) * 0.5 + 0.5) * 0.42
                + (Math.sin(t * 118.0 + 1.7) * 0.5 + 0.5) * 0.26
                + (Math.sin(t * 21.0 + 0.4) * 0.5 + 0.5) * 0.32;

      // 卡西尼缝：两道暗带
      const g1 = Math.abs(t - 0.62) / 0.035;
      const g2 = Math.abs(t - 0.34) / 0.03;
      bands *= Math.min(1, Math.min(g1, g2));

      // 内外缘渐隐
      const edge = Math.min(1, t / 0.06) * Math.min(1, (1 - t) / 0.08);

      const mixv = Math.min(1, bands);
      // cB(0xa89070) → cA(0xf0e0b8)，整体提亮，让环在天黑背景下看得见
      data[i*4+0] = Math.min(255, (0x9c + (0xd8 - 0x9c) * mixv) * (0.55 + edge * 0.45) * 0.92);
      data[i*4+1] = Math.min(255, (0x82 + (0xc0 - 0x82) * mixv) * (0.55 + edge * 0.45) * 0.92);
      data[i*4+2] = Math.min(255, (0x62 + (0x98 - 0x62) * mixv) * (0.55 + edge * 0.45) * 0.92);
      data[i*4+3] = 255;
    }

    const tex = new THREE.DataTexture(data, TEXW, 1, THREE.RGBAFormat);
    tex.needsUpdate = true;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;

    const rg = new THREE.RingGeometry(inner, outer, 256, 8);

    // RingGeometry 的 uv.x 是横向 0..1，正好当环带剖面用；
    // 但要让它沿径向走，所以把 uv 换成按半径归一化的值
    const pos = rg.attributes.position;
    const uv = rg.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const r = Math.hypot(pos.getX(i), pos.getY(i));
      const t = (r - inner) / (outer - inner);
      uv.setXY(i, Math.min(1, Math.max(0, t)), 0.5);
    }
    uv.needsUpdate = true;
    rg.rotateX(-Math.PI / 2);

    const rm = new THREE.MeshBasicMaterial({
      map: tex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
    });

    const ring = new THREE.Mesh(rg, rm);
    ring.rotation.z = cfg.tilt;
    group.add(ring);
    cfg._ring = ring;
  }

  // 地球的月亮：半径 1737.4km、轨道半径 384400km、恒星周期 27.32 天
  let moonPivot = null;
  if (cfg.name === "地球") {
    const moonPlane = new THREE.Group();
    moonPlane.rotation.x = 5.145 * DEG;   // 月球轨道相对黄道约 5.145°
    group.add(moonPlane);

    moonPivot = new THREE.Group();
    const moonGeo = new THREE.SphereGeometry(MOON_CFG.radius, 24, 18);
    const moonMat = new THREE.MeshStandardMaterial({
      color: MOON_CFG.colorA, roughness: 1.0, metalness: 0,
    });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.x = 384400 / KM_PER_UNIT;
    moon.userData = MOON_CFG;
    moonMesh = moon;

    moonDot = makeMinDot(MOON_CFG);
    moonDot.material.size = 9;
    moon.add(moonDot);
    clickable.push(moon, moonDot);

    moonPivot.add(moon);
    moonPlane.add(moonPivot);
  }

  scene.add(group);
  scene.add(makeOrbitLine(cfg));

  // 「最小可见光点」：天体本体严格按真实比例，全景下地球不足 0.001px，
  // 物理上不可见。这里叠一个屏幕尺寸恒定的指示光点，属于 UI 层，
  // 不参与比例计算，所以不破坏「真实比例」的前提。
  const dot = makeMinDot(cfg);
  group.add(dot);

  planets.push({ cfg, group, mesh, moonPivot, dot });
  clickable.push(mesh, dot);
}

// 可聚焦对象：八颗行星 + 地球的月球
const focusables = planets.map(p => ({ cfg: p.cfg, group: p.group }));
if (moonMesh) focusables.push({ cfg: MOON_CFG, group: moonMesh });

/* ============================================================
   7. 轨道相机（自实现，无 OrbitControls）
   ============================================================ */
// 「全景」默认视角；?az / ?el 可覆盖，方便截图
const HOME_THETA = qAz !== null ? qAz * Math.PI / 180 : Math.PI * 0.22;
const HOME_PHI   = qEl !== null ? qEl * Math.PI / 180 : Math.PI * 0.30;

const orbit = {
  // phi 从「竖直向上」量起：0 = 正上方俯视，PI/2 = 水平
  theta: HOME_THETA,
  phi: HOME_PHI,
  dist: qDist !== null ? qDist : 400,
  tTheta: 0, tPhi: 0, tDist: 0,
  target: new THREE.Vector3(0, 0, 0),
  panOffset: new THREE.Vector3(0, 0, 0),   // 右键平移到偏移量
};
orbit.tTheta = orbit.theta;
orbit.tPhi = orbit.phi;
orbit.tDist = orbit.dist;

/* 按视口自动算出「刚好装下全部轨道」的距离：
   竖屏时水平视角窄，必须拉得更远，否则外圈行星被裁。
   这个函数在 init 和 resize 时都会跑，手机就不会漏掉海王星。 */
const OUTER_ORBIT = Math.max(...PLANETS.map(p => p.orbit)) * 1.02 + 12;

function fitDistance() {
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);

  // 竖屏时水平视角很窄，必须按「水平方向能否装下」来算。
  // 再给标签留出固定像素宽度：屏幕宽度的 22%（两侧各 11%）不让行星进去。
  const usable = 0.78;
  const needV = OUTER_ORBIT / Math.tan(vFov / 2) / usable;
  const needH = OUTER_ORBIT / Math.tan(hFov / 2) / usable;
  return Math.max(needV, needH);
}

// 关键：上限卡在水平面之前，永远不钻到轨道面下方
const MIN_PHI = 0.10, MAX_PHI = Math.PI * 0.495;
// 自由视角下限：贴到太阳半径附近即可，不再用与尺度无关的 0.6
const PANORAMA_MIN_DIST = 0.05;
let MAX_DIST = 1200;

// 没显式指定 dist 时，用视口自适应距离
if (qDist === null) {
  orbit.dist = orbit.tDist = fitDistance();
}
MAX_DIST = Math.max(MAX_DIST, fitDistance() * 2.2);

let dragging = false;
let lastX = 0, lastY = 0;
let pointerMoved = false;

// 屏蔽右键菜单，右键改为拖动视角
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => {
  // 只在画布区域屏蔽，不影响其它 UI
  if (e.target === canvas) e.preventDefault();
});

// 0=左键 2=右键。两者都用于拖动；只有左键点击会触发聚焦
// 右键平移：按屏幕像素换算成世界坐标位移，方向跟随当前相机朝向。
// 系数要跟「一个屏幕高度覆盖多少世界单位」对齐，否则手感要么拖不动要么飞出去。
const _panRight = new THREE.Vector3();
const _panUp = new THREE.Vector3();
const _panMove = new THREE.Vector3();

function panTarget(dx, dy) {
  _panRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _panUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();

  // 相机距离处，一个像素对应多少世界单位
  const worldPerPx = (2 * orbit.dist * Math.tan(camera.fov * Math.PI / 360)) / innerHeight;

  _panMove.set(0, 0, 0);
  _panMove.addScaledVector(_panRight, -dx * worldPerPx);
  _panMove.addScaledVector(_panUp, dy * worldPerPx);

  // 只改偏移量，updateCamera 每帧会把它叠加进 target
  orbit.panOffset.add(_panMove);
}

/* ---------- 缩放对准光标 ---------- */
const _zoomRight = new THREE.Vector3();
const _zoomUp = new THREE.Vector3();
const _zoomOffset = new THREE.Vector3();
const _zoomShift = new THREE.Vector3();

// 保持光标下的「过目标点、垂直视线」平面上的点不动。
// 距离从 d0 变到 d1 时，目标点平移 p*(1-d1/d0)，光标处世界点仍落在原屏幕位置。
function zoomTowardCursor(newDist, clientX, clientY) {
  const d0 = orbit.dist;
  const d1 = Math.min(MAX_DIST, Math.max(minDistance(), newDist));
  if (!(d0 > 0) || !Number.isFinite(d1)) return;

  // 聚焦时忽略光标偏移，但仍保留 WASD/右键平移后的当前位置
  if (focusTarget) {
    orbit.tDist = d1;
    return;
  }

  if (Math.abs(d1 - d0) < d0 * 1e-6) {
    orbit.dist = orbit.tDist = d1;
    return;
  }

  const ndcX = (clientX / innerWidth) * 2 - 1;
  const ndcY = -(clientY / innerHeight) * 2 + 1;
  const halfH = d0 * Math.tan(camera.fov * Math.PI / 360);
  const halfW = halfH * camera.aspect;

  camera.updateMatrixWorld();
  _zoomRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _zoomUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
  _zoomOffset.copy(_zoomRight).multiplyScalar(ndcX * halfW)
    .addScaledVector(_zoomUp, ndcY * halfH);
  // 对极端距离比做钳制，避免刚复位等瞬态把 target 甩飞
  const ratio = Math.min(4, Math.max(0.25, d1 / d0));
  _zoomShift.copy(_zoomOffset).multiplyScalar(1 - ratio);

  orbit.target.add(_zoomShift);
  orbit.panOffset.add(_zoomShift);
  orbit.dist = orbit.tDist = d1;
}

let dragButton = 0;

canvas.addEventListener("pointerdown", (e) => {
  // 只接受左键和右键；中键忽略
  if (e.button !== 0 && e.button !== 2) return;
  dragButton = e.button;
  dragging = true;
  pointerMoved = false;
  lastX = e.clientX; lastY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  document.documentElement.classList.add("dragging");
  // 冻结当前朝向，避免残余缓动在拖动过程中改变视角；不重置 WASD/平移位置
  orbit.tTheta = orbit.theta;
  orbit.tPhi = orbit.phi;
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) pointerMoved = true;
  lastX = e.clientX; lastY = e.clientY;

  if (dragButton === 2) {
    // 右键 = 平移焦点：沿着相机自身的右向量和上向量移动观察目标点
    panTarget(dx, dy);
  } else {
    // 左键 = 环绕：改轨道角度
    orbit.tTheta -= dx * 0.0048;
    orbit.tPhi = Math.min(MAX_PHI, Math.max(MIN_PHI, orbit.tPhi - dy * 0.0040));
  }
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  document.documentElement.classList.remove("dragging");
  if (e && e.pointerId !== undefined) {
    try { if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function handleWheel(e) {
  e.preventDefault();
  // 指数式缩放：每格固定「乘一个倍率」，远近手感一致。
  // 原来的线性加法在 dist=400 时一格只动 8 单位（2%），所以推半天没反应。
  const step = Math.min(Math.abs(e.deltaY) / 100, 3);      // 归一化到「格」
  // 向前滚（deltaY < 0）＝ 拉近（距离变小），向后滚 ＝ 拉远
  const zoom = Math.exp(Math.sign(e.deltaY) * step * 0.22);  // 每格 ≈ 1.25 倍

  // 滚轮不再自动猜目标：内圈光点重叠时会锁错行星。
  // 聚焦天体请点击或滚轮经过名称标签。

  // 冻结当前朝向，避免残余缓动在缩放过程中改变视角
  orbit.tTheta = orbit.theta;
  orbit.tPhi = orbit.phi;
  // 以鼠标箭头为不动点推拉，而不是始终对准屏幕中心
  zoomTowardCursor(orbit.tDist * zoom, e.clientX, e.clientY);
}
canvas.addEventListener("wheel", handleWheel, { passive: false });

/* ---------- 触摸：手写 touch，防 pointer 被吞 ---------- */
let pinchStart = 0, pinchDist = 0;
let touchLastX = 0, touchLastY = 0, touchDragging = false;

canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    touchDragging = false;
    const [a, b] = e.touches;
    pinchStart = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    pinchDist = orbit.tDist;
    orbit.tTheta = orbit.theta;
    orbit.tPhi = orbit.phi;
  } else if (e.touches.length === 1) {
    touchDragging = true;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
    orbit.tTheta = orbit.theta;
    orbit.tPhi = orbit.phi;
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2 && pinchStart > 0) {
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const midX = (a.clientX + b.clientX) / 2;
    const midY = (a.clientY + b.clientY) / 2;
    // 指数式捏合，并锁定两指中点为推拉焦点
    zoomTowardCursor(pinchDist * Math.pow(d / pinchStart, 1.6), midX, midY);
  } else if (touchDragging && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - touchLastX;
    const dy = t.clientY - touchLastY;
    touchLastX = t.clientX;
    touchLastY = t.clientY;
    orbit.tTheta -= dx * 0.0048 * 1.7;
    orbit.tPhi = Math.min(MAX_PHI, Math.max(MIN_PHI, orbit.tPhi - dy * 0.0040 * 1.7));
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  if (e.touches.length === 0) {
    touchDragging = false;
    pinchStart = 0;
  } else if (e.touches.length === 1) {
    pinchStart = 0;
    touchDragging = true;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
  }
  e.preventDefault();
}, { passive: false });

/* ---------- 点击聚焦 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let focusTarget = null;

// 缩放下限：聚焦时允许贴近球面（1.02 倍半径），全景时保留原手感
function minDistance() {
  return focusTarget
    ? Math.max(focusTarget.cfg.radius * 1.02, 1e-5)
    : PANORAMA_MIN_DIST;
}

function pickPlanet(clientX, clientY) {
  ndc.x = (clientX / innerWidth) * 2 - 1;
  ndc.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  // 光点的拾取半径按屏幕 8px 换算；真实比例下不能沿用固定的世界单位阈值
  const worldPerPx = (2 * orbit.dist * Math.tan(camera.fov * Math.PI / 360)) / innerHeight;
  raycaster.params.Points.threshold = Math.max(1e-7, worldPerPx * 8);
  const hits = raycaster.intersectObjects(clickable, false);
  return hits.length ? hits[0].object : null;
}

function focusOn(cfg, group) {
  focusTarget = { cfg, group };
  orbit.panOffset.set(0, 0, 0);

  // 关键：把相机放到行星的「向阳面」。
  // 原来只改距离不改方位，外行星会正好把夜面转给我们，看起来就是一颗黑球。
  const wp = new THREE.Vector3();
  group.getWorldPosition(wp);
  // 相机放在「行星 → 太阳」连线的延长线上，且偏向一侧 40°，
  // 这样既看到亮面，又不至于正对着阳光全是白板
  // 相机方位：从「行星→太阳」的水平方向偏 40°，再抬高 35°。
  // 不能 normalize 后硬塞 camDir.y——水平分量会被压没，
  // 相机就跑到行星正上方垂直俯视，只能看到一个点。
  const sunDir = wp.clone().negate();
  const flat = new THREE.Vector3(sunDir.x, 0, sunDir.z).normalize();
  const side = new THREE.Vector3(-flat.z, 0, flat.x);
  const az = flat.clone().multiplyScalar(Math.cos(0.7))
    .add(side.multiplyScalar(Math.sin(0.7))).normalize();

  const elev = 0.26;
  const camDir = az.clone().multiplyScalar(Math.cos(elev));
  camDir.y = Math.sin(elev);
  camDir.normalize();

  // 让行星在屏幕上的视觉半径约占 1/5 屏高：
  //   r_px / (d * tan(fov/2)) ≈ 0.2   →   d ≈ r / (0.2 * tan(fov/2))
  // 再用 2.2 倍半径兜底，避免贴近表面穿模
  const halfFov = camera.fov * Math.PI / 360;
  const dist = Math.max(cfg.radius / (0.2 * Math.tan(halfFov)), cfg.radius * 2.2);

  // 不直接摆相机，只设「目标」。距离在对数空间插值，
  // 从全景飞到行星旁边是连续推进，而不是瞬移后突然出现一颗球。
  orbit.tDist  = dist;
  orbit.tTheta = Math.atan2(camDir.x, camDir.z);
  orbit.tPhi   = Math.PI / 2 - Math.asin(Math.max(-1, Math.min(1, camDir.y)));

  showInfo(cfg);
}

function resetView() {
  focusTarget = null;
  orbit.panOffset.set(0, 0, 0);
  orbit.tDist = fitDistance();
  orbit.tTheta = HOME_THETA;
  orbit.tPhi = HOME_PHI;
  infoEl.classList.remove("on");
}

canvas.addEventListener("click", (e) => {
  if (pointerMoved) return;   // 拖动结束不触发聚焦
  if (e.button !== 0) return; // 右键不聚焦
  const hit = pickPlanet(e.clientX, e.clientY);
  if (!hit) return;
  // 行星/卫星本体和最小光点的 userData 都是同一个 cfg，回查聚焦对象
  const holder = focusables.find(f => f.cfg === hit.userData);
  if (holder) focusOn(holder.cfg, holder.group);
});

canvas.addEventListener("dblclick", (e) => {
  // 双击天体只聚焦，不回到远景
  if (pickPlanet(e.clientX, e.clientY)) return;
  resetView();
});

/* ---------- 信息卡 ---------- */
const infoEl = document.getElementById("info");
function showInfo(cfg) {
  document.getElementById("infoName").textContent = cfg.name;
  document.getElementById("infoType").textContent = cfg.type;
  document.getElementById("infoDist").textContent = cfg.desc || `${cfg.aAU.toFixed(3)} AU`;
  document.getElementById("infoEcc").textContent = cfg.e.toFixed(4);
  document.getElementById("infoPeriod").textContent = cfg.orbitDays >= 365.25
    ? `${(cfg.orbitDays / 365.25).toFixed(2)} 年`
    : `${cfg.orbitDays.toFixed(2)} 天`;
  document.getElementById("infoMoons").textContent = cfg.moons > 0 ? `${cfg.moons} 颗` : "无";
  document.getElementById("infoInc").textContent = `${Math.abs(cfg.incDeg).toFixed(2)}°`;
  infoEl.classList.add("on");
}

/* ---------- WASD 平移视角 ---------- */
const moveKeys = new Set();
const _moveFwd = new THREE.Vector3();
const _moveRight = new THREE.Vector3();
const _moveStep = new THREE.Vector3();

function updateKeyboardMove(dt) {
  const f = (moveKeys.has("KeyW") ? 1 : 0) - (moveKeys.has("KeyS") ? 1 : 0);
  const r = (moveKeys.has("KeyD") ? 1 : 0) - (moveKeys.has("KeyA") ? 1 : 0);
  if (!f && !r) return;

  // 近距离聚焦时改为环绕天体：既不会把相机推进球体，也始终对准星球
  if (focusTarget && orbit.dist < focusTarget.cfg.radius * 30) {
    orbit.tTheta -= r * 1.0 * dt;
    orbit.tPhi = Math.min(MAX_PHI, Math.max(MIN_PHI, orbit.tPhi - f * 0.6 * dt));
    return;
  }

  // 远距离/自由视角：沿当前视角水平前向/右向平移目标点
  _moveFwd.set(-Math.sin(orbit.theta), 0, -Math.cos(orbit.theta));
  _moveRight.set(Math.cos(orbit.theta), 0, -Math.sin(orbit.theta));
  _moveStep.set(0, 0, 0).addScaledVector(_moveFwd, f).addScaledVector(_moveRight, r);
  if (_moveStep.lengthSq() === 0) return;
  // 自由视角下给一个场景尺度下限，避免缩到 0.6 时 WASD 慢到像失效
  const ref = focusTarget ? orbit.dist : Math.max(orbit.dist, 5);
  const speed = ref * 0.6;
  _moveStep.normalize().multiplyScalar(speed * dt);

  orbit.panOffset.add(_moveStep);
  orbit.target.add(_moveStep);
}

function updateCamera(dt) {
  updateKeyboardMove(dt);

  // 目标点 = 基准位置（焦点行星或原点） + 右键平移偏移
  const base = new THREE.Vector3(0, 0, 0);
  if (focusTarget) {
    focusTarget.group.getWorldPosition(base);
  }
  base.add(orbit.panOffset);

  const k2 = 1 - Math.pow(0.002, dt);
  // 聚焦且已拉近时目标必须严格跟随行星：近距离下插值滞后会让行星跑出画面
  if (focusTarget && orbit.dist < 20) {
    orbit.target.copy(base);
  } else {
    orbit.target.lerp(base, k2);
  }

  const k = 1 - Math.pow(0.0009, dt);
  orbit.theta += (orbit.tTheta - orbit.theta) * k;
  orbit.phi   += (orbit.tPhi   - orbit.phi)   * k;
  orbit.dist  += (orbit.tDist  - orbit.dist)  * k;

  // 贴近观察时自动暂停，避免相机/天体缓慢漂移；焦点和自由视角都适用
  if (!qStatic) {
    const close = orbit.dist < (focusTarget ? Math.max(focusTarget.cfg.radius * 3, 1.0) : 1.0);
    const far = orbit.dist > (focusTarget ? Math.max(focusTarget.cfg.radius * 4, 1.5) : 1.5);
    if (!autoPaused && !paused && close) {
      autoPaused = true;
      setPaused(true);
    } else if (autoPaused && far) {
      autoPaused = false;
      if (paused) setPaused(false);
    }
  }

  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.dist * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.dist * cp,
    orbit.target.z + orbit.dist * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);

  // 近平面随相机距离同步缩放：全景保持 0.5，聚焦到真实尺寸行星时
  // 必须降到远小于天体半径，否则整颗行星都会被近平面裁掉。
  const near = Math.min(0.5, Math.max(1e-6, orbit.dist * 0.01));
  if (Math.abs(camera.near - near) > near * 0.01) {
    camera.near = near;
    camera.updateProjectionMatrix();
  }
}

/* ---------- 行星标签：3D 位置投影到屏幕 ---------- */
const labelsEl = document.getElementById("labels");
const labelItems = [];
// 标签可点击聚焦；滚轮经过标签时也保持缩放
labelsEl.addEventListener("wheel", handleWheel, { passive: false });

(function buildLabels() {
  for (const p of planets) {
    const el = document.createElement("div");
    el.className = "lbl";
    el.innerHTML = `${p.cfg.name}<em>${p.cfg.aAU.toFixed(2)} AU</em>`;
    el.title = `聚焦到${p.cfg.name}`;
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      focusOn(p.cfg, p.group);
    });
    el.addEventListener("wheel", (ev) => {
      if (ev.deltaY < 0 && !focusTarget) {
        ev.preventDefault();
        ev.stopPropagation();
        focusOn(p.cfg, p.group);
        return;
      }
      handleWheel(ev);
      ev.stopPropagation();
    }, { passive: false });
    labelsEl.appendChild(el);
    labelItems.push({ el, p });
  }
})();

// 月球标签：与地球在屏幕上分开到一定距离后才显示，避免全景下重叠
if (moonMesh) {
  const el = document.createElement("div");
  el.className = "lbl";
  el.innerHTML = `月球<em>384,400 km</em>`;
  el.title = "聚焦到月球";
  el.addEventListener("click", (ev) => {
    ev.stopPropagation();
    focusOn(MOON_CFG, moonMesh);
  });
  el.addEventListener("wheel", (ev) => {
    if (ev.deltaY < 0 && !focusTarget) {
      ev.preventDefault();
      ev.stopPropagation();
      focusOn(MOON_CFG, moonMesh);
      return;
    }
    handleWheel(ev);
    ev.stopPropagation();
  }, { passive: false });
  labelsEl.appendChild(el);
  labelItems.push({ el, p: { cfg: MOON_CFG, group: moonMesh } });
}

const projV = new THREE.Vector3();
const _earthProjV = new THREE.Vector3();
const PLANET_INDEX = new Map(planets.map((p, i) => [p.cfg.name, i]));

// 标签整体布局：先收集所有投影点，再做一次简单的斥力推开，
// 避免内圈行星标签互相压住（水星以前就是这样被盖掉的）

// 标签的平滑位置：每帧朝目标缓动，避免公转/视角变化时跳
const _labSmooth = new WeakMap();
const LAB_EASE = 0.22;          // 越大跟得越紧

function updateLabels() {
  const halfW = innerWidth / 2, halfH = innerHeight / 2;

  const sunS = new THREE.Vector3(0, 0, 0).project(camera);
  const sunX = (sunS.x * halfW) + halfW;
  const sunY = (-sunS.y * halfH) + halfH;
  // 太阳在相机背后/画面外时不要参与推离，否则投影会退化到错误坐标
  const sunVisible = sunS.z > -1 && sunS.z < 1
    && Math.abs(sunS.x) < 1.2 && Math.abs(sunS.y) < 1.2;
  // 太阳本体在全景下不可见，按 UI 指示点的 9px 半径避让
  const sunPx = Math.max(9,
    (SUN_RADIUS / (camera.position.length() * Math.tan(camera.fov * Math.PI / 360))) * halfH);

  const items = [];

  for (const { el, p } of labelItems) {
    p.group.getWorldPosition(projV);
    // 先取世界距离再投影；卫星的 group 有父级变换，不能用 group.position
    const worldDist = camera.position.distanceTo(projV);
    projV.project(camera);

    const onScreen = projV.z < 1 && Math.abs(projV.x) < 1.2 && Math.abs(projV.y) < 1.2;
    const dist = worldDist;
    // 自由视角近距离时不要隐藏远处但仍在画面里的标签，否则只剩无法点击的光点
    const hideDist = focusTarget ? orbit.dist * 1.8 : Math.max(orbit.dist * 1.8, 200);
    if (!onScreen || dist > hideDist) {
      el.classList.remove("on");
      _labSmooth.delete(el);   // 再出现时直接落到新位置，不从旧位置滑过来
      continue;
    }

    // 关键：标签偏移必须在「屏幕空间」里加。
    // 原来是在世界坐标里减 projV.y，视角一压平，这个偏移投影到屏幕就收缩成 0，
    // 标签会突然贴回行星中心，看起来就是跳。
    const sx = (projV.x * halfW) + halfW;
    const sy = (-projV.y * halfH) + halfH;

    // 月球标签只在和地球屏幕位置分开时显示，否则会与地球标签叠在一起
    if (p.cfg === MOON_CFG) {
      const earth = planets.find(x => x.cfg.name === "地球");
      if (earth) {
        earth.group.getWorldPosition(_earthProjV);
        _earthProjV.project(camera);
        const eOn = _earthProjV.z > -1 && _earthProjV.z < 1
          && Math.abs(_earthProjV.x) < 1.2 && Math.abs(_earthProjV.y) < 1.2;
        const ex = (_earthProjV.x * halfW) + halfW;
        const ey = (-_earthProjV.y * halfH) + halfH;
        if (eOn && Math.hypot(sx - ex, sy - ey) < 24) {
          el.classList.remove("on");
          _labSmooth.delete(el);
          continue;
        }
      }
    }

    // 标签放在行星圆面下方；聚焦大天体时不再被固定上限压回球面
    const rPx = (p.cfg.radius / (worldDist
      * Math.tan(camera.fov * Math.PI / 360))) * halfH;
    const sxOut = sx;
    const syOut = Math.min(sy + rPx + 10, innerHeight - 26);

    items.push({
      el, p,
      x: sxOut, y: syOut,
      rawX: sx, rawY: sy,          // 斥力/推太阳之前
      w: (el.offsetWidth || 84),
      h: (el.offsetHeight || 20),
    });
  }

  // 斥力推开：多个「竖直槽位」而不是随机互推。
  // 视角拉平时所有行星在屏幕上塌成一条横线，水平方向根本没有空间，
  // 互推会让标签在一条线上反复滑动——这就是当初抖动的来源。
  // 改成按距离太阳的远近，分配确定性的上下槽位，位置只跟公转半径有关。
  // 槽位按「行星在 PLANETS 里的固定序号」分配，不按可见顺序。
  // 否则某颗一隐一现，其余标签的槽位会集体重排，看起来就是集体瞬移。
  // 聚焦时其余标签都已隐藏，唯一标签直接放在球面下方，不参与槽位布局。
  if (!focusTarget) {
    for (const it of items) {
      const idx = PLANET_INDEX.get(it.p.cfg.name);
      if (idx !== undefined && idx < 4) {
        const slot = (idx % 2 === 0 ? -1 : 1) * (14 + Math.floor(idx / 2) * 22);
        it.y = it.rawY + slot;
        it.x = it.rawX;
      }
    }
  }

  // 太阳推离：只做一次，并且是「补足差值」而不是硬吸附到圆周上。
  // 硬吸附在方向退化（ds→0）时会让标签从太阳一边瞬移到另一边。
  if (sunVisible) {
    for (const it of items) {
      const dx = it.x - sunX, dy = it.y - sunY;
      const ds = Math.hypot(dx, dy);
      const minR = sunPx + it.w / 2 + 8;
      if (ds < minR) {
        let ux, uy;
        if (ds < 0.5) {
          uy = dy === 0 && dx === 0 ? 1 : (dy >= 0 ? 1 : -1);   // 方向退化：固定朝下
          ux = 0;
        } else {
          ux = dx / ds; uy = dy / ds;
        }
        const push = minR - ds;        // 连续，ds=minR 时 push=0，不会跳
        it.x += ux * push;
        it.y += uy * push;
      }
    }
  }

  // 标签之间仍然做一次轻量互斥（只解决残留重叠，不再主导布局）
  for (let iter = 0; iter < 3; iter++) {
    const damp = 1 - iter / 5;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const minX = (a.w + b.w) / 2 + 4;
        const minY = (a.h + b.h) / 2 + 3;
        if (Math.abs(dx) < minX && Math.abs(dy) < minY) {
          const ox = minX - Math.abs(dx);
          const oy = minY - Math.abs(dy);
          const sgn = dy >= 0 ? 1 : -1;
          a.y += sgn * oy * 0.45 * damp;
          b.y -= sgn * oy * 0.45 * damp;
        }
      }
    }
  }

  // 缓动到目标位置：公转走、视角动，标签都平滑跟随而不是瞬移
  for (const it of items) {
    const prev = _labSmooth.get(it.el);
    let fx = it.x, fy = it.y;
    if (prev) {
      fx = prev.x + (it.x - prev.x) * LAB_EASE;
      fy = prev.y + (it.y - prev.y) * LAB_EASE;
    }
    _labSmooth.set(it.el, { x: fx, y: fy });
    it.el.style.left = fx + "px";
    it.el.style.top = fy + "px";
    it.el.classList.add("on");
  }
}

/* ============================================================
   8. 主循环
   ============================================================ */
const clock = new THREE.Clock();
// 自己算 dt：THREE.Clock 在部分无头/软渲染环境下 getDelta 恒为 0，
// 会让帧率与时间显示永远是「—」
let prevMs = performance.now();
let simTime = qT;
let speedMul = 1.0;
let paused = false;
let autoPaused = false;
// 每真实秒推进多少「天」：0.5 天 = 12 小时（1× 默认速度）
const DAYS_PER_SEC = 0.5;
let fpsAcc = 0, frames = 0;
const fpsEl = document.getElementById("fps");
const timeEl = document.getElementById("simtime");
const speedEl = document.getElementById("speed");

// 键盘调速度
function renderSpeed() {
  const label = speedMul.toFixed(2).replace(/\.?0+$/, "");
  speedEl.textContent = label + "×" + (paused ? " ⏸" : "");
  for (const b of document.querySelectorAll(".ctrl button")) {
    if (b.dataset.sp === undefined) continue;
    const bv = parseFloat(b.dataset.sp);
    b.classList.toggle("on", paused ? bv === 0 : bv === speedMul);
  }
}
function setPaused(v) {
  paused = v;
  renderSpeed();
}
function applySpeed(v) {
  if (v === 0) {
    setPaused(!paused);          // 再点一次继续
  } else {
    speedMul = v;
    setPaused(false);
  }
}

document.querySelectorAll(".ctrl button").forEach(b => {
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    if (b.dataset.home !== undefined) {
      resetView();
      return;
    }
    applySpeed(parseFloat(b.dataset.sp));
  });
});

addEventListener("keydown", (e) => {
  if (e.code === "ArrowUp")   applySpeed(Math.min(8, speedMul * 2));
  if (e.code === "ArrowDown") applySpeed(Math.max(0.25, speedMul / 2));
  if (e.code === "Space")     { e.preventDefault(); applySpeed(0); }
});

addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "KeyW" || e.code === "KeyA" || e.code === "KeyS" || e.code === "KeyD") {
    moveKeys.add(e.code);
    e.preventDefault();
  }
});
addEventListener("keyup", (e) => moveKeys.delete(e.code));
addEventListener("blur", () => moveKeys.clear());

const tmpV = new THREE.Vector3();

// 调试探针（?debug=1）：用于验证自转轴与季节，生产访问不受影响
if (Q.get("debug") === "1") {
  window.__dbg = {
    get planets() { return planets.map(p => p.cfg.name); },
    // 某颗行星的自转轴在世界空间的方向
    axis(name) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return null;
      p.mesh.updateWorldMatrix(true, false);
      const m = p.mesh.matrixWorld;
      const q = new THREE.Quaternion().setFromRotationMatrix(m);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q).normalize();
      return { x: +up.x.toFixed(4), y: +up.y.toFixed(4), z: +up.z.toFixed(4) };
    },
    // 太阳直射点纬度：行星→太阳 方向与自转轴的夹角余角
    subsolarLat(name) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return null;
      p.mesh.updateWorldMatrix(true, false);
      const q = new THREE.Quaternion().setFromRotationMatrix(p.mesh.matrixWorld);
      const axis = new THREE.Vector3(0, 1, 0).applyQuaternion(q).normalize();
      const wp = new THREE.Vector3();
      p.group.getWorldPosition(wp);
      const toSun = wp.clone().negate().normalize();
      const s = axis.dot(toSun);                    // sin(直射纬度)
      return +(Math.asin(Math.max(-1, Math.min(1, s))) * 180 / Math.PI).toFixed(2);
    },
    // 把某行星推到指定平近点角（度），用于扫一圈看季节
    setAngle(name, deg) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return false;
      const M = (p.cfg.meanLonDeg - p.cfg.varpiDeg) * DEG
              + (TAU / p.cfg.orbitDays) * simTime;
      p.cfg.mAnomalyBias = deg * DEG - M;
      return true;
    },
    get sunRadius() { return SUN_RADIUS; },
    get simTime() { return simTime; },
    // 光标缩放探针：返回光标下目标平面点的世界坐标
    probe(x, y) {
      camera.updateMatrixWorld();
      const d = orbit.dist;
      const ndcX = (x / innerWidth) * 2 - 1;
      const ndcY = -(y / innerHeight) * 2 + 1;
      const halfH = d * Math.tan(camera.fov * Math.PI / 360);
      const halfW = halfH * camera.aspect;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
      const p = right.multiplyScalar(ndcX * halfW).addScaledVector(up, ndcY * halfH);
      return {
        world: orbit.target.clone().add(p).toArray(),
        target: orbit.target.toArray(),
        dist: orbit.dist,
        near: camera.near,
      };
    },
    project(world) {
      const v = new THREE.Vector3(world[0], world[1], world[2]).project(camera);
      return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, z: v.z };
    },
    screenOf(name) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return null;
      const v = new THREE.Vector3();
      p.group.getWorldPosition(v);
      v.project(camera);
      return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
    },
    worldOf(name) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return null;
      const v = new THREE.Vector3();
      p.group.getWorldPosition(v);
      return v.toArray();
    },
    labelProbe(name) {
      const p = planets.find(x => x.cfg.name === name);
      if (!p) return null;
      const v = new THREE.Vector3();
      p.group.getWorldPosition(v);
      v.project(camera);
      const halfW = innerWidth / 2, halfH = innerHeight / 2;
      const sx = (v.x * halfW) + halfW;
      const sy = (-v.y * halfH) + halfH;
      const dist = camera.position.distanceTo(p.group.position);
      const rPx = (p.cfg.radius / (dist * Math.tan(camera.fov * Math.PI / 360))) * halfH;
      const sun = new THREE.Vector3(0, 0, 0).project(camera);
      return {
        sx: +sx.toFixed(3), sy: +sy.toFixed(3), dist: +dist.toFixed(9), rPx: +rPx.toFixed(3),
        syOut: +Math.min(sy + rPx + 10, innerHeight - 26).toFixed(3),
        sun: {
          x: +((sun.x * halfW) + halfW).toFixed(3),
          y: +((-sun.y * halfH) + halfH).toFixed(3),
          z: +sun.z.toFixed(6),
        },
      };
    },
    get focusName() { return focusTarget ? focusTarget.cfg.name : null; },
    view() {
      return {
        theta: +orbit.theta.toFixed(9), phi: +orbit.phi.toFixed(9),
        dist: +orbit.dist.toFixed(9), tDist: +orbit.tDist.toFixed(9),
        target: orbit.target.toArray().map(v => +v.toFixed(9)),
        panOffset: orbit.panOffset.toArray().map(v => +v.toFixed(12)),
        focus: focusTarget ? focusTarget.cfg.name : null,
      };
    },
    get scale() {
      return { auUnit: AU_UNIT, kmPerUnit: KM_PER_UNIT, radiusScale: RADIUS_SCALE };
    },
    radiiKm() {
      const out = { "太阳": 696340 };
      for (const p of planets) out[p.cfg.name] = p.cfg.radiusKm;
      return out;
    },
    // 实际几何半径：太阳 + 八行星（世界单位）
    radii() {
      const out = { "太阳": SUN_RADIUS };
      for (const p of planets) out[p.cfg.name] = +p.mesh.geometry.parameters.radius.toFixed(10);
      return out;
    },
    orbitsAU() {
      const out = {};
      for (const p of planets) out[p.cfg.name] = p.cfg.aAU;
      return out;
    },
    moon() {
      return {
        radiusKm: 1737.4, radius: kmToUnit(1737.4),
        distanceKm: 384400, distance: 384400 / KM_PER_UNIT,
        periodDays: 27.321661,
      };
    },
    // 当前自转角（弧度）与累计圈数，用于核对真实自转周期
    spins() {
      return planets.map(p => ({
        name: p.cfg.name,
        rotation: +p.mesh.rotation.y.toFixed(6),
        turns: +(p.mesh.rotation.y / TAU).toFixed(3),
      }));
    },
    // 比例审计：半径比例应恒为 RADIUS_SCALE，轨道比例应恒为 AU_UNIT
    audit() {
      return planets.map(p => ({
        name: p.cfg.name,
        radiusScale: +(p.cfg.radius / (p.cfg.radiusKm / KM_PER_UNIT)).toFixed(9),
        orbitScale: +(p.cfg.orbit / p.cfg.aAU).toFixed(9),
      }));
    },
  };
}

function animate() {
  requestAnimationFrame(animate);

  const nowMs = performance.now();
  let dt = (nowMs - prevMs) / 1000;
  prevMs = nowMs;
  // 切标签页回来会有巨大间隔，钳掉；0.25s 上限保证低帧率设备仍按真实时间推进
  dt = Math.min(Math.max(dt, 0.0001), 0.25);
  // 静态截图模式冻结着色器时间，保证同一 ?t= 每次出图一致
  const t = qStatic ? 0 : nowMs / 1000;
  window.__lastDt = dt;

  if (!qStatic && !paused) simTime += dt * speedMul * DAYS_PER_SEC;

  // 太阳
  sunUniforms.uTime.value = t;
  // 光晕永远面向相机
  corona1.quaternion.copy(camera.quaternion);
  corona2.quaternion.copy(camera.quaternion);

  // 公转与自转都由 simTime（距 J2000 的天数）直接决定，
  // 自转:公转 严格等于 spinHours : orbitDays*24，?t= 截图也能对齐。
  for (const p of planets) {
    const { cfg, group, mesh, moonPivot } = p;

    // 公转：J2000 轨道要素 + 开普勒方程，椭圆轨道、速度随日心距变化
    orbitalPosition(cfg, simTime, cfg._plane, group.position);

    // 自转：真实周期（小时）。逆向自转（金星/天王星）用负值。
    // 周期极点处会糊成一片，这是真比例的必然代价，不是 bug。
    mesh.rotation.y = (TAU / (cfg.spinHours / 24)) * simTime;

    // 月球：恒星周期 27.321661 天，和行星共用同一个模拟时钟
    if (moonPivot) {
      moonPivot.rotation.y = (TAU / 27.321661) * simTime;
    }

    // 最小可见光点：本体投影直径小于 6px 时才亮起，否则淡出
    if (p.dot) {
      const camDist = camera.position.distanceTo(group.position);
      const dPx = (cfg.radius * 2) / (camDist * Math.tan(camera.fov * Math.PI / 360)) * (innerHeight / 2);
      // 6px 以下 → 完全显示；12px 以上 → 完全关闭
      const fade = Math.min(1, Math.max(0, (12 - dPx) / 6));
      p.dot.material.opacity = fade * 0.55;
      // 随真实球体变大逐渐缩小，给拉近过程一个连续的视觉反馈
      p.dot.material.size = Math.max(5, Math.min(11, 11 - dPx * 0.6));
      p.dot.visible = fade > 0.02;
    }

    mesh.material.uniforms.uTime.value = t;
  }

  // 太阳指示点：按投影尺寸淡入淡出，与行星光点同一规则
  {
    const sunPx = (SUN_RADIUS * 2) / (camera.position.length()
      * Math.tan(camera.fov * Math.PI / 360)) * (innerHeight / 2);
    const fade = Math.min(1, Math.max(0, (12 - sunPx) / 6));
    sunDot.material.opacity = fade * 0.62;
    sunDot.material.size = Math.max(7, Math.min(13, 13 - sunPx * 0.5));
    sunDot.visible = fade > 0.02;
  }

  // 月球指示点：球体仍是亚像素大小时显示
  if (moonMesh && moonDot) {
    moonMesh.getWorldPosition(tmpV);
    const camDist = camera.position.distanceTo(tmpV);
    const dPx = (MOON_CFG.radius * 2) / (camDist * Math.tan(camera.fov * Math.PI / 360)) * (innerHeight / 2);
    const fade = Math.min(1, Math.max(0, (12 - dPx) / 6));
    moonDot.material.opacity = fade * 0.5;
    moonDot.material.size = Math.max(4, Math.min(9, 9 - dPx * 0.5));
    moonDot.visible = fade > 0.02;
  }

  // 星空闪烁
  stars.uniforms.uTime.value = t;

  updateCamera(dt);
  renderer.render(scene, camera);
  // 用本帧的相机矩阵投影标签，避免近距离聚焦时滞后一帧
  updateLabels();


  frames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    fpsEl.textContent = Math.round(frames / fpsAcc);
    // simTime 以 J2000 为 0；天数带小时，慢速时也能看出在走
    const absDays = Math.abs(simTime);
    const days = Math.floor(absDays);
    const hours = Math.floor((absDays - days) * 24);
    timeEl.textContent = `J2000 ${simTime < 0 ? "−" : "+"} ${days} 天 ${String(hours).padStart(2, "0")}h`;
    frames = 0; fpsAcc = 0;
  }
}

/* ============================================================
   9. 启动
   ============================================================ */
renderer.compile(scene, camera);
animate();

if (qStatic) {
  // 静态/截图模式：立刻移除遮罩，不等 rAF 与 1s 淡出
  const ld = document.getElementById("loader");
  ld.style.transition = "none";
  ld.style.display = "none";
  document.getElementById("hud").classList.add("on");
  document.getElementById("tip").classList.add("on");
}

requestAnimationFrame(() => {
  document.getElementById("loader").classList.add("done");
  document.getElementById("hud").classList.add("on");
  document.getElementById("tip").classList.add("on");
});

// ?focus=地球 直接聚焦某颗行星（用于截图与分享）
if (qFocus) {
  const p = planets.find((x) => x.cfg.name === qFocus);
  if (p) {
    // 必须同时设 focusTarget，否则 resize 会把距离拉回全景
    focusTarget = { cfg: p.cfg, group: p.group };
    p.group.getWorldPosition(tmpV);
    const d = Math.max(p.cfg.radius / (0.2 * Math.tan(camera.fov * Math.PI / 360)), p.cfg.radius * 2.2);

    // 相机放在「行星→太阳」方向偏 40° 的那一侧：看得见亮面，又不是正对直射
    const sunDir = tmpV.clone().negate();
    const flat = new THREE.Vector3(sunDir.x, 0, sunDir.z).normalize();
    const side = new THREE.Vector3(-flat.z, 0, flat.x);
    const az = flat.clone().multiplyScalar(Math.cos(0.7))
      .add(side.multiplyScalar(Math.sin(0.7))).normalize();

    const elev = 0.26;
    const camDir = az.clone().multiplyScalar(Math.cos(elev));
    camDir.y = Math.sin(elev);
    camDir.normalize();

    camera.position.copy(tmpV).add(camDir.clone().multiplyScalar(d));
    camera.lookAt(tmpV);

    const off = camera.position.clone().sub(tmpV);
    orbit.target.copy(tmpV);
    orbit.tDist = orbit.dist = off.length();
    orbit.tTheta = orbit.theta = Math.atan2(off.x, off.z);
    // phi 从「竖直向上」量起：仰角 15° → phi ≈ π/2 - 0.26
  orbit.tPhi = orbit.phi = Math.PI / 2 - 0.26;

    showInfo(p.cfg);
  }
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stars.uniforms.uPixel.value = renderer.getPixelRatio();

  // 视口变了，重算全景距离；正在聚焦某颗行星时不动它
  if (!focusTarget) {
    orbit.tDist = fitDistance();
  }
});
</script>
